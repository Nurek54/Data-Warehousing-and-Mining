<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Banknote Authentication" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B33"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .title { font-size: 40px; font-weight: 800; fill: #E6EDF3; letter-spacing: -0.5px; }
  .sub { font-size: 17px; fill: #9CA3AF; }
  .tag { font-size: 13px; fill: #6366F1; font-weight: 600; letter-spacing: 0.4px; }
  .sv { font-size: 26px; font-weight: 800; fill: #E6EDF3; }
  .sl { font-size: 13px; fill: #9CA3AF; }
  .nominal { font-size: 13px; font-weight: 700; fill: #9CA3AF; text-anchor: middle; }
  .edge { stroke: #30363D; stroke-width: 2; }
  .node { fill: #161B22; stroke: #484F58; stroke-width: 1.3; }
  .nlabel { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 10px; fill: #E6EDF3; text-anchor: middle; }
  .vt { font-size: 14px; font-weight: 800; fill: #fff; text-anchor: middle; letter-spacing: 0.8px; }
  .stat { opacity: 0; animation: up .7s ease-out forwards; }
  .s0 { animation-delay: .3s; } .s1 { animation-delay: .5s; } .s2 { animation-delay: .7s; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .beam { animation: scan 4s ease-in-out infinite; }
  @keyframes scan { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: .9; } 45% { transform: translateX(146px); opacity: .9; } 50%,100% { transform: translateX(146px); opacity: 0; } }
  .wave { stroke-dasharray: 160; animation: wave 4s linear infinite; }
  @keyframes wave { 0% { stroke-dashoffset: 160; opacity: .8; } 45% { stroke-dashoffset: 0; opacity: .8; } 55%,100% { stroke-dashoffset: 0; opacity: 0; } }
  .pf { animation: pf 8s infinite; } .pr { animation: pr 8s infinite; }
  @keyframes pf { 0%,10% { stroke: #30363D; } 18%,44% { stroke: #F43F5E; stroke-width: 3.5; } 50%,100% { stroke: #30363D; } }
  @keyframes pr { 0%,60% { stroke: #30363D; } 68%,94% { stroke: #10B981; stroke-width: 3.5; } 100% { stroke: #30363D; } }
  .vf { opacity: 0; animation: vf 8s infinite; } .vr { opacity: 0; animation: vr 8s infinite; }
  @keyframes vf { 0%,20% { opacity: 0; } 26%,44% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes vr { 0%,70% { opacity: 0; } 76%,94% { opacity: 1; } 100% { opacity: 0; } }
  .n-a1 { animation: la1 8s infinite; } .n-b2 { animation: lb2 8s infinite; }
  @keyframes la1 { 0%,16% { opacity: .45; } 22%,44% { opacity: 1; } 50%,100% { opacity: .45; } }
  @keyframes lb2 { 0%,66% { opacity: .45; } 72%,94% { opacity: 1; } 100% { opacity: .45; } }
  .n-a2, .n-b1 { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .stat, .vr { opacity: 1; } }
</style>
